<svg xmlns="http://www.w3.org/2000/svg" width="880" height="860" viewBox="0 0 880 860">
  <rect width="880" height="860" fill="#f4f4f4"/>
  <text x="32" y="40" font-family="ui-sans-serif, sans-serif" font-size="20" fill="#111">Academic setup</text>
  <text x="32" y="62" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#555">/admin/academic-setup  -  School Admin and Headmaster</text>

  <rect x="24" y="84" width="832" height="340" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="44" y="114" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#111">Year</text>
  <text x="44" y="136" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#555">POST /academic-year sends the ids. The boxes show the names.</text>

  <text x="44" y="168" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#333">Board  -  shows board_name, saves board_id</text>
  <rect x="44" y="176" width="760" height="36" rx="4" fill="#fafafa" stroke="#bbb"/>
  <text x="56" y="199" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#111">Andhra Pradesh SCERT</text>
  <text x="44" y="230" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#555">description: State curriculum published by the Andhra Pradesh SCERT for classes 1 to 10.</text>

  <text x="44" y="262" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#333">Calendar  -  shows calendar_name, saves calendar_id</text>
  <rect x="44" y="270" width="760" height="36" rx="4" fill="#fafafa" stroke="#bbb"/>
  <text x="56" y="293" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#111">Andhra academic calendar 2026-27</text>
  <text x="44" y="324" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#555">description: June to April term dates. Any board can recommend this calendar. No board_id on the row.</text>

  <text x="44" y="356" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#333">academic_year</text>
  <rect x="44" y="364" width="160" height="36" rx="4" fill="#fafafa" stroke="#bbb"/>
  <text x="56" y="387" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#111">2026-27</text>
  <text x="224" y="356" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#333">start_date</text>
  <rect x="224" y="364" width="150" height="36" rx="4" fill="#fafafa" stroke="#bbb"/>
  <text x="236" y="387" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#111">2026-06-15</text>
  <text x="394" y="356" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#333">end_date</text>
  <rect x="394" y="364" width="150" height="36" rx="4" fill="#fafafa" stroke="#bbb"/>
  <text x="406" y="387" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#111">2027-04-30</text>
  <rect x="680" y="364" width="124" height="36" rx="4" fill="#111"/>
  <text x="708" y="387" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#fff">Save year</text>

  <rect x="24" y="440" width="832" height="180" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="44" y="470" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#111">Local holidays</text>
  <text x="44" y="492" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#555">POST /holidays  -  DELETE /holidays/{holiday_id}</text>
  <text x="44" y="524" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#333">holiday_date</text>
  <rect x="44" y="532" width="180" height="36" rx="4" fill="#fafafa" stroke="#bbb"/>
  <text x="56" y="555" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#111">2026-08-15</text>
  <text x="244" y="524" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#333">reason</text>
  <rect x="244" y="532" width="380" height="36" rx="4" fill="#fafafa" stroke="#bbb"/>
  <text x="256" y="555" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#111">Independence Day</text>
  <rect x="644" y="532" width="168" height="36" rx="4" fill="#fff" stroke="#111"/>
  <text x="680" y="555" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#111">Add holiday</text>
  <text x="44" y="592" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#333">2026-08-15  -  Independence Day</text>
  <text x="760" y="592" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#555">Remove</text>

  <rect x="24" y="636" width="832" height="150" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="44" y="666" font-family="ui-sans-serif, sans-serif" font-size="15" fill="#111">Generate plan</text>
  <text x="44" y="688" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#555">POST /syllabus-plan/generate  -  returns created and skipped</text>
  <text x="44" y="722" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#333">class_id</text>
  <rect x="44" y="730" width="160" height="36" rx="4" fill="#fafafa" stroke="#bbb"/>
  <text x="56" y="753" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#111">1</text>
  <text x="224" y="722" font-family="ui-sans-serif, sans-serif" font-size="12" fill="#333">subject_id</text>
  <rect x="224" y="730" width="160" height="36" rx="4" fill="#fafafa" stroke="#bbb"/>
  <text x="236" y="753" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#111">1</text>
  <rect x="640" y="730" width="172" height="36" rx="4" fill="#111"/>
  <text x="668" y="753" font-family="ui-sans-serif, sans-serif" font-size="13" fill="#fff">Generate plan</text>
</svg>
