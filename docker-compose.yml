# Local Postgres for the syllabus planner. Port 5434 stays clear of the
# faculty stack, which already publishes 5433.
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: syllabus_planner_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: swais
      POSTGRES_PASSWORD: swais_secret
      POSTGRES_DB: syllabus_planner
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swais -d syllabus_planner"]
      interval: 10s
      timeout: 5s
      retries: 5
